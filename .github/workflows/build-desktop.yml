# .github/workflows/build-desktop.yml
name: Build Desktop

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'

    - name: Cache Node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: cmd/desktop/frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/cmd/desktop/frontend/package-lock.json') }}

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install system dependencies
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev pkg-config
        elif [ "$RUNNER_OS" = "Darwin" ]; then
          echo "No additional dependencies needed for macOS"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "No additional dependencies needed for Windows"
        fi
      shell: bash

    - name: Install dependencies
      run: |
        go mod download
        cd cmd/desktop/frontend && npm install
      shell: bash

    - name: Build Desktop
      run: |
        cd cmd/desktop && wails build -clean -tags webview2
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: MyApp-${{ matrix.os }}
        path: cmd/desktop/build/bin/
