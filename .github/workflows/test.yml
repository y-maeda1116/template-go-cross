name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./internal/... ./cmd/app/... ./cmd/cli/...

    - name: Upload coverage
      uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
