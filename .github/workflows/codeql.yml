name: CodeQL

# SAST 対応。Go コード (cmd / internal) を解析し、結果を Security タブへ
# アップロードする。push / PR / 週次で実行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 20 * * 1' # 毎週月曜 20:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # 解析結果 (SARIF) を Security タブへアップロードするため
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: go

      # Go はビルド時にコードを抽出する。desktop (Wails) は Linux で
      # webkit/gtk のシステム依存が必要なため対象外とし、cli と internal のみビルドする。
      - name: Build Go packages
        run: go build ./cmd/cli/... ./cmd/app/... ./internal/...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          category: /language:go
